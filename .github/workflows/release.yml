name: MotoCare Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest

      - name: 📢 Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MotoCare Release ${{ github.ref_name }}
          body: |
            ## 📱 MotoCare Release ${{ github.ref_name }}
            
            Aplikasi pengingat dan pemantau jadwal ganti oli motor pintar.
            
            ### 🛠 Catatan Rilis:
            - Fitur Manajemen Kendaraan & Log Ganti Oli
            - Kalkulasi otomatis status oli (Aman, Perlu Perhatian, Segera Ganti)
            - Notifikasi pengingat otomatis
            - UI & Theme terintegrasi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
